# Merge this section into your CLIProxyAPI v8 configuration.
# Keep the host's OAuth auth directory outside the checkout.
plugins:
  enabled: true
  dir: ./plugins
  configs:
    cpa-copilot-bridge:
      enabled: true
      github_scope: read:user
      reasoning_replay: true
      prompt_cache_key: false
      compaction_models: []
      model_endpoint_overrides: {}
      excluded_model_prefixes: []
      model_cache_ttl_seconds: 600
      token_expiry_buffer_seconds: 300
